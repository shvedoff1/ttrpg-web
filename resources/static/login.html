<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.png" type="image/png">
<title>Вход — TTRPG</title>
<script>document.documentElement.dataset.theme = localStorage.theme || 'dark'</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 12px;
    padding: 36px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 6px;
    color: #e0c97f;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 28px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    background: #0d1b2a;
    border-radius: 8px;
    padding: 4px;
  }

  .tab-btn {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: #888;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
  }

  .tab-btn.active {
    background: #0f3460;
    color: #e0c97f;
    font-weight: 600;
  }

  .form-group {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 0.8rem;
    color: #aaa;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 10px 14px;
    background: #0d1b2a;
    border: 1px solid #0f3460;
    border-radius: 8px;
    color: #e0e0e0;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus {
    border-color: #e0c97f;
  }

  .btn-primary {
    width: 100%;
    padding: 11px;
    background: #e0c97f;
    color: #1a1a2e;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.15s;
  }

  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: #555;
    font-size: 0.8rem;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #0f3460;
  }

  .btn-google {
    width: 100%;
    padding: 10px;
    background: #fff;
    color: #333;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: opacity 0.15s;
  }

  .btn-google:hover { opacity: 0.9; }

  .btn-google svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .error-msg {
    background: rgba(220, 53, 69, 0.15);
    border: 1px solid rgba(220, 53, 69, 0.4);
    color: #ff8080;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.85rem;
    margin-bottom: 16px;
    display: none;
  }

  .error-msg.visible { display: block; }

  .back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #888;
    font-size: 0.85rem;
    text-decoration: none;
  }

  .back-link:hover { color: #e0c97f; }

  #googleSection { display: block; }
</style>
</head>
<body>

<div class="card">
  <h1>⚔ TTRPG</h1>
  <p class="subtitle">Войдите или создайте аккаунт</p>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('login')">Войти</button>
    <button class="tab-btn" onclick="switchTab('register')">Регистрация</button>
  </div>

  <div id="errorMsg" class="error-msg"></div>

  <!-- Login form -->
  <form id="loginForm" onsubmit="submitLogin(event)">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginUsername" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-primary" id="loginBtn">Войти</button>
  </form>

  <!-- Register form -->
  <form id="registerForm" style="display:none" onsubmit="submitRegister(event)">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="regEmail" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label>Никнейм <span style="color:#555">(необязательно — можно задать позже)</span></label>
      <input type="text" id="regUsername" autocomplete="username" minlength="2" maxlength="60">
    </div>
    <div class="form-group">
      <label>Пароль (минимум 6 символов)</label>
      <input type="password" id="regPassword" autocomplete="new-password" required minlength="6">
    </div>
    <button type="submit" class="btn-primary" id="registerBtn">Зарегистрироваться</button>
  </form>

  <div id="googleSection">
    <div class="divider">или</div>
    <a href="/auth/google" class="btn-google">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Войти через Google
    </a>
  </div>

  <a href="/play" class="back-link">← Вернуться к игре</a>
</div>

<script>
  const REDIRECT = new URLSearchParams(location.search).get('next') || '/play';

  // ── Handle Google OAuth redirect with access_token ──────────────────────
  (function handleGoogleCallback() {
    const params = new URLSearchParams(location.search);
    const token = params.get('access_token');
    if (token) {
      localStorage.setItem('access_token', token);
      history.replaceState({}, '', location.pathname);
      window.location.href = REDIRECT;
    }
  })();

  function switchTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('loginForm').style.display = isLogin ? '' : 'none';
    document.getElementById('registerForm').style.display = isLogin ? 'none' : '';
    document.querySelectorAll('.tab-btn').forEach((btn, i) => {
      btn.classList.toggle('active', (i === 0) === isLogin);
    });
    clearError();
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('visible');
  }

  function clearError() {
    document.getElementById('errorMsg').classList.remove('visible');
  }

  async function submitLogin(e) {
    e.preventDefault();
    clearError();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Входим...';
    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('loginUsername').value.trim(),
          password: document.getElementById('loginPassword').value,
        }),
        credentials: 'include',
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Ошибка входа');
      localStorage.setItem('access_token', data.access_token);
      window.location.href = REDIRECT;
    } catch (err) {
      showError(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Войти';
    }
  }

  async function submitRegister(e) {
    e.preventDefault();
    clearError();
    const btn = document.getElementById('registerBtn');
    btn.disabled = true;
    btn.textContent = 'Регистрируем...';
    try {
      const res = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('regEmail').value.trim(),
          username: document.getElementById('regUsername').value.trim() || null,
          password: document.getElementById('regPassword').value,
        }),
        credentials: 'include',
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Ошибка регистрации');
      localStorage.setItem('access_token', data.access_token);
      window.location.href = REDIRECT;
    } catch (err) {
      showError(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Зарегистрироваться';
    }
  }
</script>

</body>
</html>
