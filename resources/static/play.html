<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.png" type="image/png">
<title>TTRPG — Игра</title>
<script>document.documentElement.dataset.theme = localStorage.theme || 'dark'</script>
<link rel="stylesheet" href="play.css">
</head>
<body>

<div class="layout">

  <!-- ══ Left column: header + engines ════════════════ -->
  <div class="left-col">

    <header>
      <span class="header-title" id="gameTitle">TTRPG</span>
      <select id="gameSelect" class="header-select" style="display:none"></select>
      <div class="header-right">
        <button id="themeToggle" class="theme-toggle" title="Сменить тему">🌙</button>
        <span id="userName" class="header-btn" style="display:none;border:none;cursor:default"></span>
        <a id="loginBtn" href="/login?next=/play" class="header-btn">Войти</a>
        <button id="logoutBtn" class="header-btn" style="display:none">Выйти</button>
        <a href="/games" class="header-btn">Мои игры</a>
      </div>
    </header>

    <nav class="engine-tabs" id="engineTabs"></nav>

    <main class="engine-content" id="engineContent">
      <div class="engine-loading">Загрузка...</div>
    </main>

  </div><!-- /.left-col -->

  <!-- ══ Right column: journal ════════════════════════ -->
  <aside class="log-col">
    <div class="log-header">
      <span class="log-title">📜 Журнал</span>
      <div class="log-tabs" id="logTabs"></div>
      <button id="clearLogBtn" class="log-clear-btn">Очистить</button>
    </div>
    <div class="log-entries" id="logEntries">
      <div class="log-empty">Результаты появятся здесь</div>
    </div>
  </aside>

</div><!-- /.layout -->

<script type="module" src="/js/main.js"></script>

</body>
</html>
