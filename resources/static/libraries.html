<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.png" type="image/png">
<title>Библиотеки данных</title>
<script>document.documentElement.dataset.theme = localStorage.theme || 'dark'</script>
<script src="/js/app-header.js" data-page="libraries"></script>
<script src="/js/lib-browser.js"></script>
<style>
  :root, :root[data-theme="dark"] {
    --bg: #1a1a2e; --bg2: #16213e; --bg3: #0f3460;
    --gold: #c9a84c; --gold2: #e8c96a;
    --text: #e0e0e0; --muted: #888;
    --danger: #e06c75; --success: #98c379; --border: #2a2a4a;
  }
  :root[data-theme="light"] {
    --bg: #f5f0e8; --bg2: #ede7d9; --bg3: #d4c9a8;
    --gold: #7a5c18; --gold2: #5c4010;
    --text: #1a1a1a; --muted: #666;
    --danger: #c0392b; --success: #27ae60; --border: #c8b87a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }

  header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 1.1rem; color: var(--gold); flex: 1; }
  header a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
  header a:hover { color: var(--text); }

  .container { max-width: 1000px; margin: 0 auto; padding: 24px 20px; }

  /* Filter bar — same pill style as lib-browser modal */
  .filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .pill-group { display: flex; gap: 4px; flex-wrap: wrap; }
  .pill { padding: 5px 14px; border-radius: 16px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 0.82rem; cursor: pointer; transition: all .15s; white-space: nowrap; }
  .pill.active { background: var(--bg3); color: var(--gold); border-color: var(--gold); }
  .pill:hover:not(.active) { color: var(--text); }
  .filter-bar .spacer { flex: 1; min-width: 10px; }
  .filter-search { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; color: var(--text); padding: 5px 14px; font-size: 0.82rem; min-width: 180px; }
  .filter-search:focus { outline: none; border-color: var(--gold); }

  /* Library grid */
  .lib-grid { display: grid; gap: 10px; }
  .lib-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start; position: relative; transition: border-color .15s; }
  .lib-card:hover { border-color: var(--gold); }
  .lib-card .info { flex: 1; min-width: 0; }
  .lib-card .name { font-size: 0.95rem; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lib-card .slug { font-size: 0.75rem; color: var(--muted); font-family: monospace; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lib-card .desc { font-size: 0.82rem; color: var(--muted); }
  .lib-card .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .badge { font-size: 0.72rem; padding: 2px 8px; border-radius: 10px; background: var(--bg3); color: var(--gold); }
  .badge.system { color: var(--muted); }
  .badge.public { color: var(--success); }
  .lib-card .actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }

  /* Hover preview tooltip */
  .preview-tooltip {
    position: fixed; z-index: 500; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; max-width: 260px; pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,.4); font-size: 0.8rem;
    display: none;
  }
  .preview-tooltip.show { display: block; }
  .preview-tooltip .pt-title { font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
  .preview-tooltip .pt-items { display: flex; flex-direction: column; gap: 2px; }
  .preview-tooltip .pt-item { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview-tooltip .pt-more { color: var(--muted); font-style: italic; }

  .btn { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.8rem; font-weight: 500; transition: opacity .2s; white-space: nowrap; }
  .btn:hover { opacity: .85; }
  .btn-primary { background: var(--gold); color: #1a1a2e; }
  .btn-danger  { background: var(--danger); color: #fff; }
  .btn-ghost   { background: transparent; border: 1px solid var(--border); color: var(--text); }

  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .loading { color: var(--muted); padding: 40px 0; text-align: center; }

  /* Modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 100%; max-width: 720px; max-height: 92vh; overflow-y: auto; }
  .modal h2 { color: var(--gold); margin-bottom: 18px; font-size: 1.05rem; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); padding: 8px 12px; font-size: 0.875rem; font-family: inherit; resize: vertical;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--gold); }
  .field textarea { font-family: monospace; font-size: 0.82rem; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .modal-error { color: var(--danger); font-size: 0.85rem; margin-top: 8px; min-height: 1.2em; }

  /* Editor mode toggle */
  .editor-toggle { display: flex; gap: 0; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; width: fit-content; }
  .editor-toggle button { padding: 5px 16px; font-size: 0.82rem; border: none; background: transparent; color: var(--muted); cursor: pointer; transition: all .15s; }
  .editor-toggle button.active { background: var(--bg3); color: var(--gold); }
  .editor-toggle button:hover:not(.active) { color: var(--text); }

  /* Visual editor — item_catalog */
  .ve-table-wrap { overflow-x: auto; }
  .ve-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  .ve-table th { text-align: left; padding: 6px 8px; color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 500; }
  .ve-table td { padding: 4px 4px; vertical-align: middle; }
  .ve-table tr:hover td { background: var(--bg3); }
  .ve-input { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); padding: 4px 8px; font-size: 0.82rem; width: 100%; font-family: inherit; }
  .ve-input:focus { outline: none; border-color: var(--gold); }
  .ve-input.mono { font-family: monospace; }
  .ve-del { background: transparent; border: none; color: var(--danger); cursor: pointer; font-size: 1rem; padding: 2px 6px; }
  .ve-add-row { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 0.82rem; color: var(--gold); cursor: pointer; background: none; border: 1px dashed var(--border); border-radius: 6px; padding: 5px 14px; transition: border-color .15s; }
  .ve-add-row:hover { border-color: var(--gold); }

  /* Visual editor — key-value */
  .ve-kv-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .ve-kv-row .ve-input.key { width: 160px; flex-shrink: 0; }
  .ve-kv-row .ve-input.val { flex: 1; }

  /* Visual editor — engine_config / chest_game */
  .ve-chest-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .ve-chest-card .chest-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .ve-chest-card .chest-key { font-family: monospace; font-size: 0.8rem; color: var(--muted); }
  .ve-chest-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .ve-chest-row label { font-size: 0.8rem; color: var(--muted); min-width: 110px; }
  .ve-chest-row input { background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; color: var(--text); padding: 4px 8px; font-size: 0.82rem; width: 80px; }
  .ve-chest-row input:focus { outline: none; border-color: var(--gold); }
  .ve-cats-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; margin-top: 6px; }
  .ve-cat-item { display: flex; gap: 6px; align-items: center; margin-bottom: 5px; }
  .ve-cat-item select { flex: 1; background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; color: var(--text); padding: 4px 8px; font-size: 0.8rem; }
  .ve-cat-item select:focus { outline: none; border-color: var(--gold); }

  #toast { position: fixed; bottom: 24px; right: 24px; background: var(--bg3); color: var(--text); padding: 10px 18px; border-radius: 8px; font-size: 0.875rem; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 200; }
  #toast.show { opacity: 1; }

  .data-view { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-family: monospace; font-size: 0.78rem; white-space: pre-wrap; max-height: 50vh; overflow-y: auto; }
</style>
</head>
<body>

<header id="app-header"></header>

<div class="container">
  <div id="loading" class="loading">Загрузка…</div>
  <div id="main" style="display:none">

    <!-- Filter bar -->
    <div class="filter-bar">
      <div class="pill-group">
        <button class="pill active" onclick="switchTab('system')">Системные</button>
        <button class="pill" onclick="switchTab('mine')">Мои</button>
        <button class="pill" onclick="switchTab('public')">Публичные</button>
      </div>
      <div class="pill-group">
        <button class="pill active" onclick="switchType('')">Все типы</button>
        <button class="pill" onclick="switchType('item_catalog')">Каталоги</button>
        <button class="pill" onclick="switchType('engine_config')">Конфиги</button>
        <button class="pill" onclick="switchType('generator_props')">Свойства</button>
      </div>
      <span class="spacer"></span>
      <input type="search" class="filter-search" id="search-input" placeholder="Поиск…" oninput="renderList()">
      <button class="btn btn-primary" id="create-btn" onclick="openCreate()" style="display:none">+ Создать</button>
    </div>

    <div class="lib-grid" id="lib-list"></div>
    <div class="empty" id="empty-msg" style="display:none">Ничего не найдено</div>
  </div>
</div>

<!-- Hover preview tooltip -->
<div class="preview-tooltip" id="preview-tooltip">
  <div class="pt-title" id="pt-title"></div>
  <div class="pt-items" id="pt-items"></div>
</div>

<!-- Modal: create / edit -->
<div class="modal-backdrop" id="modal-edit" style="display:none" onclick="if(event.target===this)closeEdit()">
  <div class="modal">
    <h2 id="modal-title">Создать библиотеку</h2>
    <div class="field">
      <label>Название *</label>
      <input id="m-name" type="text" placeholder="Моя библиотека предметов">
    </div>
    <div class="field">
      <label>Slug (опционально, автогенерируется)</label>
      <input id="m-slug" type="text" placeholder="user.items.my-custom" style="font-family:monospace">
    </div>
    <div class="field">
      <label>Описание</label>
      <input id="m-desc" type="text" placeholder="Краткое описание">
    </div>
    <div class="field">
      <label>Тип *</label>
      <select id="m-type" onchange="onTypeChange()">
        <option value="item_catalog">Каталог предметов</option>
        <option value="engine_config">Конфиг движка</option>
        <option value="generator_props">Свойства генератора</option>
      </select>
    </div>
    <div class="field">
      <label>Движок (для engine_config)</label>
      <select id="m-engine">
        <option value="">— не указан —</option>
        <option value="chest_game">chest_game</option>
        <option value="trader_inventory">trader_inventory</option>
        <option value="item_generator">item_generator</option>
        <option value="story_motivation">story_motivation</option>
        <option value="treasure">treasure</option>
        <option value="profession_roll">profession_roll</option>
      </select>
    </div>
    <div class="field">
      <label>Публичная</label>
      <select id="m-public">
        <option value="false">Нет (только я вижу)</option>
        <option value="true">Да (видна всем)</option>
      </select>
    </div>

    <!-- Editor section -->
    <div class="field">
      <label>Данные *</label>
      <div class="editor-toggle" id="editor-toggle">
        <button class="active" onclick="setEditorMode('visual')">Визуальный</button>
        <button onclick="setEditorMode('json')">JSON</button>
      </div>
      <div id="visual-editor"></div>
      <div id="json-editor" style="display:none">
        <textarea id="m-data" rows="12" placeholder="{}"></textarea>
      </div>
    </div>

    <div class="modal-error" id="modal-err"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeEdit()">Отмена</button>
      <button class="btn btn-primary" onclick="saveEdit()">Сохранить</button>
    </div>
  </div>
</div>

<!-- Modal: view data -->
<div class="modal-backdrop" id="modal-view" style="display:none" onclick="if(event.target===this)closeView()">
  <div class="modal">
    <h2 id="view-title">Данные библиотеки</h2>
    <div class="field">
      <label>Slug: <code id="view-slug" style="color:var(--gold)"></code></label>
    </div>
    <div class="data-view" id="view-data"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeView()">Закрыть</button>
      <button class="btn btn-ghost" id="view-copy-btn" onclick="copyViewData()">Скопировать slug</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let accessToken = localStorage.getItem('access_token');
let _tab = 'system';
let _typeFilter = '';
let _allLibs = [];
let _editSlug = null;
let _editorMode = 'visual';
let _allItemLibs = [];  // item_catalog libs for category picker

// ── API helpers ───────────────────────────────────────────────────────────────

async function apiReq(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (accessToken) opts.headers['Authorization'] = 'Bearer ' + accessToken;
  if (body !== undefined) opts.body = JSON.stringify(body);
  let res = await fetch(path, opts);
  if (res.status === 401) {
    const rr = await fetch('/auth/refresh', { method: 'POST', credentials: 'include' });
    if (rr.ok) {
      const rd = await rr.json();
      accessToken = rd.access_token;
      localStorage.setItem('access_token', accessToken);
      opts.headers['Authorization'] = 'Bearer ' + accessToken;
      res = await fetch(path, opts);
    } else {
      window.location.href = '/login';
      return null;
    }
  }
  return res;
}

async function apiJson(method, path, body) {
  const res = await apiReq(method, path, body);
  if (!res) return null;
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    return { _error: err.detail || `Ошибка ${res.status}` };
  }
  if (res.status === 204) return {};
  return res.json();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function typeLabel(t) {
  return { item_catalog: 'Каталог', engine_config: 'Конфиг движка', generator_props: 'Свойства' }[t] || t;
}

function getCurrentUser() {
  try { return JSON.parse(localStorage.getItem('user_info') || 'null'); } catch { return null; }
}

// ── Tabs / filters ────────────────────────────────────────────────────────────

function switchTab(tab) {
  _tab = tab;
  document.querySelectorAll('.filter-bar .pill-group:first-child .pill').forEach((el, i) => {
    el.classList.toggle('active', ['system','mine','public'][i] === tab);
  });
  document.getElementById('create-btn').style.display = (tab === 'mine') ? '' : 'none';
  renderList();
}

function switchType(type) {
  _typeFilter = type;
  document.querySelectorAll('.filter-bar .pill-group:nth-child(2) .pill').forEach((el, i) => {
    el.classList.toggle('active', ['','item_catalog','engine_config','generator_props'][i] === type);
  });
  renderList();
}

// ── Hover preview ─────────────────────────────────────────────────────────────

let _previewTimer = null;

function showPreview(lib, rect) {
  const preview = lib.preview || [];
  if (!preview.length && !lib.description) return;

  const tt = document.getElementById('preview-tooltip');
  document.getElementById('pt-title').textContent = typeLabel(lib.lib_type) + (lib.engine_id ? ` · ${lib.engine_id}` : '');

  const itemsEl = document.getElementById('pt-items');
  if (preview.length) {
    itemsEl.innerHTML = preview.map(p => `<div class="pt-item">• ${escHtml(p)}</div>`).join('');
    if (lib.preview && lib.preview.length >= 5) {
      itemsEl.innerHTML += '<div class="pt-more">…</div>';
    }
  } else {
    itemsEl.innerHTML = `<div class="pt-item">${escHtml(lib.description || '')}</div>`;
  }

  // Position: above or below the card
  tt.classList.add('show');
  const ttH = tt.offsetHeight;
  const spaceBelow = window.innerHeight - rect.bottom;
  const top = spaceBelow > ttH + 16 ? rect.bottom + 8 : rect.top - ttH - 8;
  tt.style.top = Math.max(8, top) + 'px';
  tt.style.left = Math.min(rect.left, window.innerWidth - 278) + 'px';
}

function hidePreview() {
  clearTimeout(_previewTimer);
  document.getElementById('preview-tooltip').classList.remove('show');
}

// ── Render list ───────────────────────────────────────────────────────────────

function getFilteredLibs() {
  const q = (document.getElementById('search-input')?.value || '').toLowerCase();
  const user = getCurrentUser();
  return _allLibs.filter(lib => {
    if (_tab === 'system' && lib.owner_id !== null) return false;
    if (_tab === 'mine' && lib.owner_id !== user?.id) return false;
    if (_tab === 'public' && (!lib.is_public || lib.owner_id === null)) return false;
    if (_typeFilter && lib.lib_type !== _typeFilter) return false;
    if (q && !lib.name.toLowerCase().includes(q) && !lib.slug.includes(q)) return false;
    return true;
  });
}

function renderList() {
  const libs = getFilteredLibs();
  const el = document.getElementById('lib-list');
  const empty = document.getElementById('empty-msg');
  const user = getCurrentUser();

  if (!libs.length) {
    el.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  el.innerHTML = libs.map(lib => {
    const isSystem = lib.owner_id === null;
    const isMine = lib.owner_id === user?.id;
    const badges = [
      `<span class="badge ${isSystem ? 'system' : ''}">${typeLabel(lib.lib_type)}</span>`,
      isSystem ? '<span class="badge system">системная</span>' : '',
      lib.is_public && !isSystem ? '<span class="badge public">публичная</span>' : '',
      lib.engine_id ? `<span class="badge">${escHtml(lib.engine_id)}</span>` : '',
      lib.source_slug ? '<span class="badge">скопирована</span>' : '',
    ].filter(Boolean).join('');

    const btnView = `<button class="btn btn-ghost" onclick="viewLib('${escHtml(lib.slug)}')">Просмотр</button>`;
    const btnCopy = `<button class="btn btn-ghost" onclick="copyLib('${escHtml(lib.slug)}')">Копировать</button>`;
    const btnEdit = isMine ? `<button class="btn btn-ghost" onclick="openEdit('${escHtml(lib.slug)}')">Изменить</button>` : '';
    const btnDel  = isMine ? `<button class="btn btn-danger" onclick="deleteLib('${escHtml(lib.slug)}')">Удалить</button>` : '';

    return `
<div class="lib-card" data-slug="${escHtml(lib.slug)}"
  onmouseenter="_onCardHover(event, '${escHtml(lib.slug)}')"
  onmouseleave="hidePreview()">
  <div class="info">
    <div class="name">${escHtml(lib.name)}</div>
    <div class="slug">${escHtml(lib.slug)}</div>
    ${lib.description ? `<div class="desc">${escHtml(lib.description)}</div>` : ''}
    <div class="badges">${badges}</div>
  </div>
  <div class="actions">
    ${btnView}${btnCopy}${btnEdit}${btnDel}
  </div>
</div>`;
  }).join('');
}

function _onCardHover(event, slug) {
  clearTimeout(_previewTimer);
  const lib = _allLibs.find(l => l.slug === slug);
  if (!lib || (!lib.preview?.length && !lib.description)) return;
  const rect = event.currentTarget.getBoundingClientRect();
  _previewTimer = setTimeout(() => showPreview(lib, rect), 200);
}

// ── View modal ────────────────────────────────────────────────────────────────

async function viewLib(slug) {
  const res = await apiJson('GET', `/api/libraries/${slug}`);
  if (!res || res._error) { toast(res?._error || 'Ошибка'); return; }
  document.getElementById('view-title').textContent = res.name;
  document.getElementById('view-slug').textContent = res.slug;
  document.getElementById('view-data').textContent = JSON.stringify(res.data, null, 2);
  document.getElementById('view-copy-btn').dataset.slug = res.slug;
  document.getElementById('modal-view').style.display = '';
}

function closeView() { document.getElementById('modal-view').style.display = 'none'; }

function copyViewData() {
  const slug = document.getElementById('view-copy-btn').dataset.slug;
  navigator.clipboard.writeText(slug).then(() => toast('Slug скопирован: ' + slug));
}

// ── Copy library ──────────────────────────────────────────────────────────────

async function copyLib(slug) {
  const newName = prompt('Название копии:', '');
  if (!newName) return;
  const res = await apiJson('POST', `/api/libraries/${slug}/copy`, { new_name: newName });
  if (!res || res._error) { toast(res?._error || 'Ошибка'); return; }
  toast('Библиотека скопирована: ' + res.slug);
  await loadLibs();
  switchTab('mine');
}

// ── Editor mode ───────────────────────────────────────────────────────────────

function setEditorMode(mode) {
  if (_editorMode === mode) return;

  if (mode === 'json') {
    // sync visual → JSON
    const data = _collectVisualData();
    if (data !== null) {
      document.getElementById('m-data').value = JSON.stringify(data, null, 2);
    }
  } else {
    // sync JSON → visual
    let data;
    try { data = JSON.parse(document.getElementById('m-data').value || '{}'); } catch { data = {}; }
    _renderVisualEditor(data);
  }

  _editorMode = mode;
  const btns = document.querySelectorAll('.editor-toggle button');
  btns[0].classList.toggle('active', mode === 'visual');
  btns[1].classList.toggle('active', mode === 'json');
  document.getElementById('visual-editor').style.display = mode === 'visual' ? '' : 'none';
  document.getElementById('json-editor').style.display = mode === 'json' ? '' : 'none';
}

function onTypeChange() {
  _renderVisualEditor({});
  document.getElementById('m-data').value = '{}';
}

function _renderVisualEditor(data) {
  const type = document.getElementById('m-type').value;
  const engine = document.getElementById('m-engine').value;
  const container = document.getElementById('visual-editor');

  if (type === 'item_catalog') {
    _renderItemCatalogEditor(container, data);
  } else if (type === 'generator_props') {
    _renderGenPropsEditor(container, data);
  } else if (type === 'engine_config' && engine === 'chest_game') {
    _renderChestEditor(container, data);
  } else {
    container.innerHTML = '<div style="color:var(--muted);font-size:0.82rem;padding:8px 0">Для этого типа используйте JSON-редактор</div>';
  }
}

// ── Visual editor: item_catalog ────────────────────────────────────────────────

function _renderItemCatalogEditor(container, data) {
  const rows = Object.entries(data).map(([id, v]) => ({ id, name: v?.name || '', prob: v?.probability ?? '', price: v?.price ?? '' }));
  container.innerHTML = `
<div class="ve-table-wrap">
<table class="ve-table">
<thead><tr>
  <th style="width:130px">ID</th>
  <th>Название</th>
  <th style="width:100px">Вероятность</th>
  <th style="width:80px">Цена</th>
  <th style="width:36px"></th>
</tr></thead>
<tbody id="ve-rows">
${rows.map(_renderItemRow).join('')}
</tbody>
</table>
</div>
<button class="ve-add-row" onclick="_addItemRow()">+ Добавить</button>`;
}

function _renderItemRow(row, i) {
  return `<tr data-i="${i}">
  <td><input class="ve-input mono" data-f="id" value="${escHtml(row.id)}" placeholder="item_key"></td>
  <td><input class="ve-input" data-f="name" value="${escHtml(row.name)}" placeholder="Название предмета"></td>
  <td><input class="ve-input" data-f="prob" type="number" min="0" value="${row.prob}" placeholder="0"></td>
  <td><input class="ve-input" data-f="price" type="number" min="0" value="${row.price}" placeholder="—"></td>
  <td><button class="ve-del" onclick="this.closest('tr').remove()" title="Удалить">×</button></td>
</tr>`;
}

function _addItemRow() {
  const tbody = document.getElementById('ve-rows');
  const i = tbody.rows.length;
  const tr = document.createElement('tr');
  tr.dataset.i = i;
  tr.innerHTML = `
  <td><input class="ve-input mono" data-f="id" placeholder="item_key"></td>
  <td><input class="ve-input" data-f="name" placeholder="Название предмета"></td>
  <td><input class="ve-input" data-f="prob" type="number" min="0" placeholder="0"></td>
  <td><input class="ve-input" data-f="price" type="number" min="0" placeholder="—"></td>
  <td><button class="ve-del" onclick="this.closest('tr').remove()" title="Удалить">×</button></td>`;
  tbody.appendChild(tr);
}

function _collectItemCatalog() {
  const tbody = document.getElementById('ve-rows');
  if (!tbody) return null;
  const result = {};
  for (const tr of tbody.rows) {
    const id = tr.querySelector('[data-f=id]')?.value.trim();
    if (!id) continue;
    const name = tr.querySelector('[data-f=name]')?.value.trim() || id;
    const probStr = tr.querySelector('[data-f=prob]')?.value.trim();
    const priceStr = tr.querySelector('[data-f=price]')?.value.trim();
    const entry = { name };
    if (probStr !== '') entry.probability = parseFloat(probStr) || 0;
    if (priceStr !== '') entry.price = parseFloat(priceStr) || 0;
    result[id] = entry;
  }
  return result;
}

// ── Visual editor: generator_props ────────────────────────────────────────────

function _renderGenPropsEditor(container, data) {
  const rows = Object.entries(data);
  container.innerHTML = `
<div id="ve-kv-list">
${rows.map(([k, v]) => _renderKvRow(k, typeof v === 'string' ? v : JSON.stringify(v))).join('')}
</div>
<button class="ve-add-row" onclick="_addKvRow()">+ Добавить свойство</button>`;
}

function _renderKvRow(k, v) {
  return `<div class="ve-kv-row">
  <input class="ve-input mono key" data-f="k" placeholder="ключ" value="${escHtml(k)}">
  <input class="ve-input val" data-f="v" placeholder="значение" value="${escHtml(v)}">
  <button class="ve-del" onclick="this.closest('.ve-kv-row').remove()" title="Удалить">×</button>
</div>`;
}

function _addKvRow() {
  const list = document.getElementById('ve-kv-list');
  const div = document.createElement('div');
  div.className = 've-kv-row';
  div.innerHTML = `
  <input class="ve-input mono key" data-f="k" placeholder="ключ">
  <input class="ve-input val" data-f="v" placeholder="значение">
  <button class="ve-del" onclick="this.closest('.ve-kv-row').remove()" title="Удалить">×</button>`;
  list.appendChild(div);
}

function _collectGenProps() {
  const list = document.getElementById('ve-kv-list');
  if (!list) return null;
  const result = {};
  for (const row of list.querySelectorAll('.ve-kv-row')) {
    const k = row.querySelector('[data-f=k]')?.value.trim();
    const v = row.querySelector('[data-f=v]')?.value.trim();
    if (!k) continue;
    result[k] = v;
  }
  return result;
}

// ── Visual editor: engine_config (chest_game) ─────────────────────────────────

function _renderChestEditor(container, data) {
  const itemCatLibs = _allLibs.filter(l => l.lib_type === 'item_catalog');
  const catOptions = itemCatLibs.map(l => `<option value="${escHtml(l.slug)}">${escHtml(l.name)} (${escHtml(l.slug)})</option>`).join('');

  const chestEntries = Object.entries(data);
  const cardsHtml = chestEntries.map(([key, cfg]) => _renderChestCard(key, cfg, catOptions)).join('');

  container.innerHTML = `
<div id="ve-chests">${cardsHtml}</div>
<button class="ve-add-row" onclick="_addChestCard()">+ Добавить тип сундука</button>`;
}

function _renderChestCard(key, cfg, catOptions) {
  const cats = (cfg.categories || []);
  const catsHtml = cats.map(c => _renderCatRow(c, catOptions)).join('');
  const dirs = (cfg.game?.directions || []).join(', ');
  return `
<div class="ve-chest-card" data-key="${escHtml(key)}">
  <div class="chest-header">
    <div class="chest-key">Ключ:</div>
    <input class="ve-input mono" style="width:140px" data-cf="key" value="${escHtml(key)}" placeholder="common">
    <input class="ve-input" style="flex:1" data-cf="name" value="${escHtml(cfg.name || '')}" placeholder="Название сундука">
    <button class="ve-del" onclick="this.closest('.ve-chest-card').remove()" title="Удалить">×</button>
  </div>
  <div class="ve-chest-row">
    <label>Золото (мин/макс)</label>
    <input type="number" data-cf="gold_min" value="${cfg.gold_min ?? 0}" min="0" style="width:80px">
    <input type="number" data-cf="gold_max" value="${cfg.gold_max ?? 0}" min="0" style="width:80px">
  </div>
  <div class="ve-chest-row">
    <label>Предметы (мин/макс)</label>
    <input type="number" data-cf="items_min" value="${cfg.items_min ?? 0}" min="0" style="width:80px">
    <input type="number" data-cf="items_max" value="${cfg.items_max ?? 0}" min="0" style="width:80px">
  </div>
  <div class="ve-chest-row">
    <label>Длина / Направления</label>
    <input type="number" data-cf="game_length" value="${cfg.game?.length ?? 3}" min="1" max="10" style="width:60px" title="Длина последовательности">
    <input data-cf="game_dirs" value="${escHtml(dirs)}" placeholder="up, down, left, right" style="flex:1" title="Направления через запятую">
  </div>
  <div class="ve-cats-label">Категории предметов</div>
  <div class="ve-cat-list" data-key="${escHtml(key)}">${catsHtml}</div>
  <button class="ve-add-row" style="margin-top:6px;font-size:0.78rem" onclick="_addCatRow(this, ${JSON.stringify(catOptions).replace(/</g,'\\u003c')})">+ Категория</button>
</div>`;
}

function _renderCatRow(slug, catOptions) {
  const selected = catOptions.replace(`value="${escHtml(slug)}"`, `value="${escHtml(slug)}" selected`);
  return `<div class="ve-cat-item">
    <select data-cf="cat">${selected}</select>
    <button class="ve-del" onclick="this.closest('.ve-cat-item').remove()" title="Удалить">×</button>
  </div>`;
}

function _addCatRow(btn, catOptions) {
  const list = btn.previousElementSibling;
  const div = document.createElement('div');
  div.className = 've-cat-item';
  div.innerHTML = `<select data-cf="cat">${catOptions}</select>
    <button class="ve-del" onclick="this.closest('.ve-cat-item').remove()" title="Удалить">×</button>`;
  list.appendChild(div);
}

function _addChestCard() {
  const container = document.getElementById('ve-chests');
  const catOptions = _allLibs.filter(l => l.lib_type === 'item_catalog')
    .map(l => `<option value="${escHtml(l.slug)}">${escHtml(l.name)} (${escHtml(l.slug)})</option>`).join('');
  const div = document.createElement('div');
  div.innerHTML = _renderChestCard('new_chest', { name: '', gold_min: 0, gold_max: 50, items_min: 1, items_max: 3, game: { length: 3, directions: ['left','right'] }, categories: [] }, catOptions);
  container.appendChild(div.firstElementChild);
}

function _collectChestConfig() {
  const container = document.getElementById('ve-chests');
  if (!container) return null;
  const result = {};
  for (const card of container.querySelectorAll('.ve-chest-card')) {
    const get = f => card.querySelector(`[data-cf="${f}"]`);
    const key = get('key')?.value.trim();
    if (!key) continue;
    const dirsRaw = get('game_dirs')?.value || '';
    const dirs = dirsRaw.split(',').map(s => s.trim()).filter(Boolean);
    const cats = [...card.querySelectorAll('[data-cf=cat]')].map(s => s.value).filter(Boolean);
    result[key] = {
      name: get('name')?.value.trim() || key,
      gold_min: parseInt(get('gold_min')?.value) || 0,
      gold_max: parseInt(get('gold_max')?.value) || 0,
      items_min: parseInt(get('items_min')?.value) || 0,
      items_max: parseInt(get('items_max')?.value) || 0,
      game: { length: parseInt(get('game_length')?.value) || 3, directions: dirs },
      categories: cats,
    };
  }
  return result;
}

// ── Collect visual data ────────────────────────────────────────────────────────

function _collectVisualData() {
  const type = document.getElementById('m-type').value;
  const engine = document.getElementById('m-engine').value;
  if (type === 'item_catalog') return _collectItemCatalog();
  if (type === 'generator_props') return _collectGenProps();
  if (type === 'engine_config' && engine === 'chest_game') return _collectChestConfig();
  // For other types in visual mode, just return null (use JSON fallback)
  return null;
}

// ── Create / Edit modal ───────────────────────────────────────────────────────

function openCreate() {
  _editSlug = null;
  document.getElementById('modal-title').textContent = 'Создать библиотеку';
  document.getElementById('m-name').value = '';
  document.getElementById('m-slug').value = '';
  document.getElementById('m-desc').value = '';
  document.getElementById('m-type').value = 'item_catalog';
  document.getElementById('m-engine').value = '';
  document.getElementById('m-public').value = 'false';
  document.getElementById('m-data').value = '{}';
  document.getElementById('modal-err').textContent = '';
  _editorMode = 'visual';
  _updateEditorToggle();
  _renderVisualEditor({});
  document.getElementById('visual-editor').style.display = '';
  document.getElementById('json-editor').style.display = 'none';
  document.getElementById('modal-edit').style.display = '';
}

async function openEdit(slug) {
  const res = await apiJson('GET', `/api/libraries/${slug}`);
  if (!res || res._error) { toast(res?._error || 'Ошибка'); return; }
  _editSlug = slug;
  document.getElementById('modal-title').textContent = 'Изменить библиотеку';
  document.getElementById('m-name').value = res.name;
  document.getElementById('m-slug').value = res.slug;
  document.getElementById('m-desc').value = res.description || '';
  document.getElementById('m-type').value = res.lib_type;
  document.getElementById('m-engine').value = res.engine_id || '';
  document.getElementById('m-public').value = res.is_public ? 'true' : 'false';
  document.getElementById('m-data').value = JSON.stringify(res.data, null, 2);
  document.getElementById('modal-err').textContent = '';
  _editorMode = 'visual';
  _updateEditorToggle();
  _renderVisualEditor(res.data);
  document.getElementById('visual-editor').style.display = '';
  document.getElementById('json-editor').style.display = 'none';
  document.getElementById('modal-edit').style.display = '';
}

function _updateEditorToggle() {
  const btns = document.querySelectorAll('.editor-toggle button');
  btns[0].classList.toggle('active', _editorMode === 'visual');
  btns[1].classList.toggle('active', _editorMode === 'json');
}

function closeEdit() {
  document.getElementById('modal-edit').style.display = 'none';
  _editSlug = null;
}

async function saveEdit() {
  const errEl = document.getElementById('modal-err');
  errEl.textContent = '';

  const name = document.getElementById('m-name').value.trim();
  if (!name) { errEl.textContent = 'Название обязательно'; return; }

  let data;
  if (_editorMode === 'visual') {
    const vd = _collectVisualData();
    if (vd !== null) {
      data = vd;
    } else {
      // fallback to JSON
      try { data = JSON.parse(document.getElementById('m-data').value || '{}'); } catch {
        errEl.textContent = 'Невалидный JSON'; return;
      }
    }
  } else {
    try { data = JSON.parse(document.getElementById('m-data').value); } catch {
      errEl.textContent = 'Невалидный JSON в поле данных'; return;
    }
  }

  const body = {
    name,
    description: document.getElementById('m-desc').value.trim() || null,
    lib_type: document.getElementById('m-type').value,
    engine_id: document.getElementById('m-engine').value || null,
    is_public: document.getElementById('m-public').value === 'true',
    data,
  };

  let res;
  if (_editSlug) {
    res = await apiJson('PATCH', `/api/libraries/${_editSlug}`, body);
  } else {
    const slug = document.getElementById('m-slug').value.trim();
    if (slug) body.slug = slug;
    res = await apiJson('POST', '/api/libraries', body);
  }

  if (!res || res._error) { errEl.textContent = res?._error || 'Ошибка сервера'; return; }

  toast(_editSlug ? 'Сохранено' : 'Библиотека создана');
  closeEdit();
  await loadLibs();
  if (!_editSlug) switchTab('mine');
}

// ── Delete ────────────────────────────────────────────────────────────────────

async function deleteLib(slug) {
  if (!confirm(`Удалить библиотеку «${slug}»?`)) return;
  const res = await apiJson('DELETE', `/api/libraries/${slug}`);
  if (res && res._error) { toast(res._error); return; }
  toast('Удалено');
  await loadLibs();
}

// ── Load data ─────────────────────────────────────────────────────────────────

async function loadLibs() {
  const res = await apiJson('GET', '/api/libraries?include_system=true');
  if (!res || res._error) { _allLibs = []; return; }
  _allLibs = res;
  renderList();
}

async function init() {
  const res = await apiJson('GET', '/api/libraries?include_system=true');
  document.getElementById('loading').style.display = 'none';
  document.getElementById('main').style.display = '';
  _allLibs = (!res || res._error) ? [] : res;
  LibBrowser.init(_allLibs, getCurrentUser()?.id || null);
  renderList();
}

init();
</script>
</body>
</html>
